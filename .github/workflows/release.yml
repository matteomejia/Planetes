name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching Cargo.toml (for example 0.1.0)'
        required: true
        default: '0.1.0'
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-portable
          path: dist
      - name: Create draft and attach portable download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="dist/Planetes-v${RELEASE_VERSION}-windows-x64.zip"
          test -f "$archive"
          test -f "$archive.sha256"
          gh release create "v$RELEASE_VERSION" "$archive" "$archive.sha256" \
            --draft --target "$GITHUB_SHA" --title "Planetes v$RELEASE_VERSION" \
            --notes-file "docs/releases/v$RELEASE_VERSION.md"
