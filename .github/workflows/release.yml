name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching Cargo.toml (for example 0.4.0)'
        required: true
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-release
          path: dist/velopack
      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Create draft with installer and update packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "dist/velopack/Planetes-$RELEASE_VERSION-full.nupkg"
          test -f dist/velopack/SHA256SUMS.txt
          # A draft is invisible to the app's update check until it is published. The channel is
          # explicit because vpk defaults to the runner's OS (linux here); the packages are win.
          vpk upload github --channel win --outputDir dist/velopack --repoUrl "https://github.com/$GITHUB_REPOSITORY" \
            --token "$GH_TOKEN" --tag "v$RELEASE_VERSION" --targetCommitish "$GITHUB_SHA" \
            --releaseName "Planetes v$RELEASE_VERSION"
          gh release edit "v$RELEASE_VERSION" --notes-file "docs/releases/v$RELEASE_VERSION.md"
          gh release upload "v$RELEASE_VERSION" dist/velopack/SHA256SUMS.txt
