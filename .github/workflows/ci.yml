name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    name: Windows tests and portable package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      # Seed delta updates only from an older version. Documentation PRs and post-release
      # main builds can have the same version as the latest release; vpk rejects that seed.
      # There is none before the first release, so a failed lookup/download is fine.
      - name: Download previous release
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'planetes').version
          $tag = gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not find the latest published release.' }
          if ([version]$tag.TrimStart('v') -lt [version]$version) {
            vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir dist/velopack
            if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed.' }
          } else {
            Write-Host "Skipping delta seed: latest release $tag is not older than $version."
          }
      - name: Build installer and update packages
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release
          path: dist/velopack/
          if-no-files-found: error
