[package]
name = "planetes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A minimal, fast launcher for installed Steam and Epic games"
repository = "https://github.com/matteomejia/Planetes"

[dependencies]
rune.workspace = true
rune-kit.workspace = true
planetes-core.workspace = true
planetes-stores.workspace = true
planetes-launcher.workspace = true
serde_json.workspace = true
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Controls"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
