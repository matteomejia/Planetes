[workspace]
resolver = "3"
members = ["crates/core", "crates/stores", "crates/launcher", "crates/cli", "app"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
planetes-core = { path = "crates/core" }
planetes-stores = { path = "crates/stores" }
planetes-launcher = { path = "crates/launcher" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2.1.1"
steam-vdf-parser = "0.1.2"
percent-encoding = "2"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
rune = { git = "https://github.com/anomalyco/rune", rev = "7256c7c2afb605862ccfe600a469df7330509efb" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7256c7c2afb605862ccfe600a469df7330509efb" }

[profile.dev.package."*"]
debug = false

[profile.perf]
inherits = "release"
incremental = false
debug = false
